blueprint:
  name: Motion Light with Auto Ownership
  description: >-
    Turns lights on when motion is detected in low light and turns them off
    after a configurable period without motion, but only when this automation
    switched them on. Failed turn-off commands are retried, and ownership is
    retained until every controlled light reports off. Switching a controlled
    light on manually (app, dashboard, voice, wall switch) releases ownership,
    so manually switched lights are never turned off by this automation.
    Attribute-only updates are ignored. A light reporting on counts as a
    manual change only while no motion is detected and at least 30 seconds
    after an automatic switch-on, so slow devices (e.g. Matter lights that
    report 20+ seconds late) do not release ownership.
  domain: automation
  author: BennyPirates
  source_url: https://raw.githubusercontent.com/BennyPirates/home-assistant-motion-light-blueprints/main/blueprints/motion_light_auto_ownership.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: Devices
      icon: mdi:motion-sensor
      input:
        motion_sensor:
          name: Motion sensor
          selector:
            entity:
              domain: binary_sensor
        illuminance_sensor:
          name: Illuminance sensor
          selector:
            entity:
              domain: sensor
        guard_lights:
          name: Lights that must be off
          description: The automation starts only when every selected light is off.
          selector:
            entity:
              domain: light
              multiple: true
        target_lights:
          name: Light(s) to control
          selector:
            entity:
              domain: light
              multiple: true
        auto_flag:
          name: Automatic-light flag
          description: Set only while this automation owns the light state.
          selector:
            entity:
              domain: input_boolean
    settings:
      name: Settings
      icon: mdi:cog
      collapsed: true
      input:
        illuminance_threshold:
          name: Illuminance threshold
          description: Lights turn on only below this value.
          default: 15
          selector:
            number:
              min: 0
              max: 10000
              step: 1
              unit_of_measurement: lx
              mode: box
        no_motion_wait:
          name: No-motion wait time
          description: Time to keep the lights on after motion clears.
          default: 300
          selector:
            number:
              min: 0
              max: 3600
              step: 30
              unit_of_measurement: seconds
              mode: box

mode: restart
max_exceeded: silent

variables:
  auto_flag_entity: !input auto_flag
  motion_entity: !input motion_sensor

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_detected
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: no_motion_timeout
  - trigger: state
    entity_id: !input target_lights
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: light_changed

conditions:
  - alias: >-
      Ignore light changes caused by this automation and attribute-only
      updates (keeps the retry loop alive)
    condition: template
    value_template: >-
      {{ trigger.id != 'light_changed'
         or (trigger.to_state.context.parent_id is none
             and trigger.from_state.state != trigger.to_state.state) }}

actions:
  - choose:
      - alias: Manual light change releases ownership
        conditions:
          - condition: trigger
            id: light_changed
          - condition: state
            entity_id: !input auto_flag
            state: "on"
          - condition: or
            conditions:
              - alias: >-
                  Switched on without motion and not a late device report
                  within 30 s after this automation switched the lights on
                condition: template
                value_template: >-
                  {{ trigger.to_state.state == 'on'
                     and is_state(motion_entity, 'off')
                     and as_timestamp(now())
                         - as_timestamp(states[auto_flag_entity].last_changed) > 30 }}
              - condition: state
                entity_id: !input target_lights
                state: "off"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input auto_flag
      - conditions:
          - condition: trigger
            id: motion_detected
          - condition: state
            entity_id: !input guard_lights
            state: "off"
          - condition: numeric_state
            entity_id: !input illuminance_sensor
            below: !input illuminance_threshold
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input auto_flag
          - action: light.turn_on
            target:
              entity_id: !input target_lights
      - conditions:
          - condition: trigger
            id: no_motion_timeout
          - condition: state
            entity_id: !input auto_flag
            state: "on"
        sequence:
          - repeat:
              count: 3
              sequence:
                - action: light.turn_off
                  target:
                    entity_id: !input target_lights
                  continue_on_error: true
                - delay:
                    seconds: 5
          - if:
              - condition: state
                entity_id: !input target_lights
                state: "off"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: !input auto_flag
